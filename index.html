<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.1.0/",
    "react": "https://esm.sh/react@^19.1.0",
    "react-dom/": "https://esm.sh/react-dom@^19.1.0/",
    "@google/genai": "https://esm.sh/@google/genai@^1.0.1",
    "dompurify": "https://esm.sh/dompurify@^3.1.5"
  }
}
</script>
  <script>
    // Immediately try to set dark mode to prevent FOUC
    (function() {
      if (localStorage.getItem('adaptivaStudyDarkMode') === 'true' || 
          (!('adaptivaStudyDarkMode' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    })();

    tailwind.config = {
      darkMode: 'class', // Enable class strategy for dark mode
      theme: {
        extend: {
          colors: {
            brand: {
              black: '#000000',
              orange: '#F3511E',
              yellow: '#FACC15',
              white: '#FFFFFF',
              blue: '#0057A0',
              red: '#D71012',
              green: '#2E7D32',
              lightGray: '#F5F5F5', 
              mediumGray: '#E0E0E0',
            }
          }
        }
      }
    }
  </script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-brand-white text-brand-black dark:bg-brand-black dark:text-gray-100 transition-colors duration-300">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
